[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-assist"
version = "1.0.0"
description = "Real-time driver drowsiness detection (EAR, PERCLOS, MAR, blink rate, head nod) with MediaPipe Face Mesh"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "mediapipe==0.10.21",   # pulls in opencv-contrib-python and numpy<2
    "pillow>=9",            # on-screen text
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32"]
dev = ["pytest>=8", "ruff>=0.5", "streamlit>=1.32"]

[project.scripts]
driver-assist = "drowsiness.cli:main"

[tool.setuptools.package-data]
drowsiness = ["assets/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/drowsiness/ui.py" = ["E501"]          # long CSS and HTML strings
"src/drowsiness/dashboard.py" = ["E501"]   # interface text
