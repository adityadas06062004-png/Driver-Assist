[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-assist"
version = "0.3.0"
description = "Real-time driver drowsiness detection (EAR, PERCLOS, MAR, blink rate, head nod) with MediaPipe Face Mesh"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "mediapipe==0.10.21",   # pulls in opencv-contrib-python and numpy<2
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
